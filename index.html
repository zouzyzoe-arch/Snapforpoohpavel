<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snapforpoohpavel</title>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;height:100%}
body{
  margin:0;min-height:100%;color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#050505;color:#ededed;-webkit-font-smoothing:antialiased;
  /* 红黑背景光晕 */
  background-image:
    radial-gradient(900px 520px at 8% -10%, rgba(230,0,0,.12), transparent 62%),
    radial-gradient(820px 520px at 92% -4%, rgba(130,0,0,.1), transparent 62%);
  background-attachment:fixed;
}
/* 按钮 */
.btn{border:none;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.16s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:linear-gradient(135deg,#e60000,#990000);color:#fff;box-shadow:0 6px 18px rgba(230,0,0,.25)}
.btn.primary:hover{filter:brightness(1.2);transform:translateY(-1px)}
.btn.ghost{background:#111;color:#bbb;border:1px solid #333}
.btn.ghost:hover{background:#1a1a1a;color:#fff;border-color:#555}
.btn.danger{background:rgba(230,0,0,.15);color:#ff4d4d;border:1px solid rgba(230,0,0,.4)}
.btn.danger:hover{background:rgba(230,0,0,.25)}
.icon-btn{background:transparent;border:none;color:#888;font-size:16px;cursor:pointer;width:30px;height:30px;border-radius:8px;transition:.15s}
.icon-btn:hover{background:#222;color:#fff}
/* 品牌 Logo */
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,#e60000,#660000);box-shadow:0 6px 18px rgba(230,0,0,.3)}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.3px}
.brand-sub{margin-top:1px;font-size:11.5px;color:#888}
/* 头部导航 */
.front-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;padding:13px 28px;background:rgba(5,5,5,.85);backdrop-filter:blur(14px);border-bottom:1px solid #1f1f1f;flex-wrap:wrap}
.front-nav{display:flex;gap:6px;margin-left:auto}
.front-nav a{color:#999;text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:9px;transition:.18s}
.front-nav a:hover{color:#fff;background:#1a1a1a}
.front-main{max-width:980px;margin:0 auto;padding:30px 24px 70px}
/* 主页 Hero */
.hero{position:relative;text-align:center;padding:62px 24px 50px;border-radius:26px;border:1px solid #1f1f1f;margin-bottom:44px;background:linear-gradient(180deg,#111,#080808);overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);background-size:26px 26px;mask-image:radial-gradient(circle at 50% 30%, #000, transparent 78%)}
.hero h1{position:relative;font-size:clamp(27px,5vw,44px);margin:16px 0 12px;letter-spacing:1px;line-height:1.25;background:linear-gradient(120deg,#ffffff 20%,#ff4d4d 60%,#990000 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-stats{position:relative;display:flex;justify-content:center;gap:46px;margin-top:36px;flex-wrap:wrap}
.hero-stats .item{text-align:center;min-width:70px}
.hero-stats b{display:block;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}
.hero-stats span{display:block;margin-top:5px;font-size:12px;color:#888}
/* 分区 */
.front-section{margin-bottom:56px}
.section-head h2{font-size:19px;margin:0;letter-spacing:.5px;color:#eee}
.section-head h2::before{content:'';display:inline-block;width:5px;height:16px;border-radius:3px;margin-right:10px;vertical-align:-2px;background:linear-gradient(135deg,#e60000,#660000)}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:#111;border:1px solid #2a2a2a;border-radius:11px;padding:11px 14px;color:#eee;font-size:13.5px;outline:none;transition:.16s}
.search:focus{border-color:rgba(230,0,0,.6);box-shadow:0 0 0 3px rgba(230,0,0,.1)}
.select{background:#111;border:1px solid #2a2a2a;border-radius:11px;padding:11px 13px;color:#eee;font-size:13.5px;outline:none}
/* 活动卡片 */
.ev-card{display:flex;gap:16px;background:#0d0d0d;border:1px solid #1f1f1f;border-radius:16px;padding:16px;margin-bottom:12px;transition:.2s}
.ev-card:hover{border-color:#3a1a1a;background:#111}
.ev-side{flex:0 0 62px;text-align:center;border-right:1px solid #1f1f1f;padding-right:14px}
.ev-day{font-size:24px;font-weight:800;line-height:1.1;background:linear-gradient(135deg,#ff4d4d,#990000);-webkit-background-clip:text;background-clip:text;color:transparent}
.ev-mon{font-size:11.5px;color:#888;margin-top:3px}
.ev-week{font-size:11px;color:#555;margin-top:2px}
.ev-main{flex:1;min-width:0}
.ev-head h3{font-size:15px;margin:0;font-weight:700;line-height:1.5;word-break:break-word}
.ev-desc{font-size:13.5px;color:#aaa;line-height:1.75;margin:8px 0 0;white-space:pre-wrap}
.ev-tags span{font-size:11.5px;color:#888;background:#1a1a1a;padding:3px 9px;border-radius:8px;margin-right:5px}
/* 媒体网格 */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-top:12px}
.media-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000;cursor:zoom-in;position:relative;border:1px solid #222}
.media-item img,.media-item video{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.media-item:hover img{transform:scale(1.05)}
/* 账本卡片 */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:#0f0f0f;border:1px solid #1f1f1f;border-radius:15px;padding:15px 18px}
.stat-card .label{font-size:12.5px;color:#888}
.stat-card .value{font-size:22px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.ex-item{display:flex;align-items:center;gap:14px;background:#0d0d0d;border:1px solid #1f1f1f;border-radius:13px;padding:13px 16px;margin-bottom:9px;transition:.18s}
.ex-item:hover{border-color:#3a1a1a;background:#111}
.ex-date{font-size:11.5px;color:#888;background:#1a1a1a;padding:5px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
.ex-main{flex:1;min-width:0}
.ex-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-note{font-size:12.5px;color:#777;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-amount{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
/* 标签 Pill */
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.pill.income{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.pill.expense{background:rgba(230,0,0,.15);color:#ff4d4d;border:1px solid rgba(230,0,0,.4)}
/* 后台 Header */
.admin-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:12px 24px;background:rgba(5,5,5,.9);backdrop-filter:blur(14px);border-bottom:1px solid #1f1f1f;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:#111;padding:4px;border-radius:12px;border:1px solid #222}
.tab{background:transparent;border:none;color:#888;padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s}
.tab:hover{color:#ccc}
.tab.active{background:linear-gradient(135deg,rgba(230,0,0,.2),rgba(130,0,0,.2));color:#fff;box-shadow:inset 0 0 0 1px rgba(230,0,0,.4)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.admin-main{max-width:1080px;margin:0 auto;padding:26px 24px 90px}
.a-panel{display:none}
.a-panel.active{display:block;animation:fade .24s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal.open{display:flex}
.modal-box{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:18px;width:100%;max-width:620px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.8);animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid #1f1f1f}
.modal-head h2{font-size:16px;margin:0;color:#eee}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid #1f1f1f}
/* 表单 */
.field{display:flex;flex-direction:column;gap:7px;flex:1}
.field>span{font-size:12.5px;color:#888;font-weight:600}
.field input,.field select,.field textarea{background:#050505;border:1px solid #2a2a2a;border-radius:10px;padding:11px 13px;color:#eee;font-size:13.5px;outline:none;width:100%;transition:.16s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(230,0,0,.6);box-shadow:0 0 0 3px rgba(230,0,0,.1)}
.field textarea{resize:vertical;line-height:1.7}
.row{display:flex;gap:14px}
/* 上传区 */
.dropzone{border:1.5px dashed #333;border-radius:12px;padding:20px;text-align:center;color:#777;font-size:13px;cursor:pointer;display:block;position:relative;overflow:hidden;transition:.18s;background:#0a0a0a}
.dropzone:hover{border-color:rgba(230,0,0,.5);color:#ff4d4d}
.dropzone input[type="file"] {position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.media-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.pv-item{aspect-ratio:1;border-radius:9px;overflow:hidden;background:#000;position:relative;border:1px solid #222}
.pv-item img,.pv-item video{width:100%;height:100%;object-fit:cover;display:block}
.pv-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.8);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.pv-del:hover{background:#e60000}
/* 空状态 */
.empty{text-align:center;padding:58px 20px;color:#555}
.empty .big{font-size:40px;margin-bottom:14px;opacity:.75}
.empty p{margin:0;font-size:13.5px}
/* 页脚 & 大图 */
.front-footer{text-align:center;padding:30px 20px 46px;color:#555;font-size:12.5px;border-top:1px solid #1a1a1a}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;display:none;align-items:center;justify-content:center;padding:28px;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img,.lightbox video{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 70px rgba(230,0,0,.15)}
</style>
</head>
<body>

<div id="front-app">
  <header class="front-header">
    <div class="brand"><div class="logo">★</div><div><div class="brand-name" id="f-site-name">Snapforpoohpavel</div><div class="brand-sub">记录每一次心动瞬间</div></div></div>
    <nav class="front-nav"><a href="#f-timeline">活动时间线</a><a href="#f-expense">应援账本</a></nav>
    <button class="btn ghost" id="btn-open-login">🔒 管理入口</button>
  </header>
  <main class="front-main">
    <section class="hero"><h1 id="f-hero-name">Snapforpoohpavel</h1><div class="hero-stats" id="f-hero-stats"></div></section>
    
    <section id="f-timeline" class="front-section">
      <div class="section-head"><h2>活动时间线</h2></div>
      <div class="toolbar">
        <input class="search" id="f-search-events" placeholder="搜索活动标题 / 内容 / 标签…">
      </div>
      <div id="f-timeline-list"></div>
    </section>

    <section id="f-expense" class="front-section">
      <div class="section-head"><h2>应援账本公示</h2></div>
      <div class="summary" id="f-expense-summary"></div>
      <div id="f-expense-list"></div>
    </section>
  </main>
  <footer class="front-footer">© <span id="f-year"></span> Snapforpoohpavel · 用爱发电</footer>
</div>

<div id="admin-app" hidden>
  <header class="admin-header">
    <div class="brand"><div class="logo">⚙</div><div class="brand-name">站子后台</div></div>
    <nav class="tabs">
      <button class="tab active" data-atab="timeline">🕒 活动管理</button>
      <button class="tab" data-atab="expense">💰 收支管理</button>
      <button class="tab" data-atab="settings">⚙ 设置</button>
    </nav>
    <div class="top-actions">
      <button class="btn ghost" id="btn-show-front">查看前台</button>
      <button class="btn primary" id="btn-add">+ 新建活动</button>
    </div>
  </header>
  <main class="admin-main">
    <section id="a-panel-timeline" class="a-panel active"><div id="a-timeline-list"></div></section>
    <section id="a-panel-expense" class="a-panel"><div class="summary" id="a-expense-summary"></div><div id="a-expense-list"></div></section>
    <section id="a-panel-settings" class="a-panel">
      <div style="background:#0f0f0f;border:1px solid #2a2a2a;border-radius:16px;padding:20px;max-width:400px">
        <h3>退出登录</h3><button class="btn danger" id="btn-logout" style="margin-top:10px">退出登录</button>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal-login">
  <div class="modal-box" style="max-width:390px">
    <div class="modal-head"><h2>管理登录</h2><button class="icon-btn" id="btn-close-login">✕</button></div>
    <div class="modal-body">
      <label class="field"><span>管理员邮箱</span><input type="email" id="login-email" placeholder="输入邮箱"></label>
      <label class="field"><span>密码</span><input type="password" id="login-pwd" placeholder="输入密码"></label>
      <p id="login-hint" style="color:#ff4d4d;font-size:12px;margin:0"></p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="btn-cancel-login">取消</button>
      <button class="btn primary" id="login-submit">进入后台</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-event">
  <div class="modal-box">
    <div class="modal-head"><h2>活动记录</h2><button class="icon-btn" id="btn-close-event">✕</button></div>
    <div class="modal-body">
      <div class="row">
        <label class="field"><span>日期</span><input type="date" id="ev-date"></label>
        <label class="field"><span>活动类型</span><select id="ev-type"><option>演唱会</option><option>见面会</option><option>打歌 / 舞台</option><option>其他</option></select></label>
      </div>
      <label class="field"><span>标题</span><input type="text" id="ev-title" placeholder="例：首尔演唱会 Day1"></label>
      <label class="field"><span>记录内容</span><textarea id="ev-desc" rows="3"></textarea></label>
      <label class="field"><span>标签</span><input type="text" id="ev-tags" placeholder="舞台, 饭拍"></label>
      <div class="field">
        <span>图片 / 视频</span>
        <div class="dropzone">
          <div>点击这里选择照片/视频</div>
          <input type="file" id="ev-files" accept="image/*,video/*" multiple>
        </div>
        <div class="media-preview" id="ev-preview"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="btn-cancel-event">取消</button><button class="btn primary" id="ev-save">保存</button></div>
  </div>
</div>

<div class="modal" id="modal-expense">
  <div class="modal-box" style="max-width:540px">
    <div class="modal-head"><h2>收支记录</h2><button class="icon-btn" id="btn-close-expense">✕</button></div>
    <div class="modal-body">
      <div class="row">
        <label class="field"><span>类型</span>
          <select id="ex-type">
            <option value="expense">💸 支出</option>
            <option value="income">💰 收入</option>
          </select>
        </label>
        <label class="field"><span>日期</span><input type="date" id="ex-date"></label>
      </div>
      <div class="row">
        <label class="field"><span>金额（元）</span><input type="number" id="ex-amount" min="0" step="0.01"></label>
        <label class="field"><span>分类</span><input type="text" id="ex-cat" list="cat-options"></label>
      </div>
      <datalist id="cat-options">
        <option value="应援物"></option><option value="广告投放"></option><option value="集资"></option><option value="赞助"></option><option value="其他"></option>
      </datalist>
      <label class="field"><span>项目名称</span><input type="text" id="ex-title"></label>
      <label class="field"><span>备注</span><textarea id="ex-note" rows="2"></textarea></label>
      <div class="field">
        <span>凭证截图（可选）</span>
        <div class="dropzone">
          <div>点击这里选择截图</div>
          <input type="file" id="ex-files" accept="image/*" multiple>
        </div>
        <div class="media-preview" id="ex-preview"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="btn-cancel-expense">取消</button><button class="btn primary" id="ex-save">保存</button></div>
  </div>
</div>

<div class="lightbox" id="lightbox"></div>

<script>
window.onerror = function(msg) { alert("页面发生错误: " + msg); return false; };

const SUPABASE_URL = 'https://jhdmotgxxetvdjslgiek.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9XIghyqF1T6N0SwR75Ml7w_UKnRXEPm';

let events = [], expenses = [];
let isAdmin = false;
let currentAdminTab = 'timeline';
let fQuery = '', aQuery = '';
window.pendingEvMedia = []; 
window.pendingExMedia = [];
let editEvId = null, editExId = null;

async function api(path, method = 'GET', body = null, timeoutMs = 8000) {
  const token = localStorage.getItem('sb_token');
  const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token || SUPABASE_KEY}` };
  if (body && !(body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(body);
    headers['Prefer'] = 'return=minimal';
  }
  
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

  try {
    const res = await fetch(`${SUPABASE_URL}${path}`, { method, headers, body, signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || err.error_description || '网络请求失败');
    }
    if (method === 'GET' || res.status === 201) return res.json().catch(() => null);
    return null;
  } catch (e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') throw new Error('网络连接超时，请检查网络设置');
    throw e;
  }
}

const parseDate = s => { const [y, m, d] = String(s || '').split('-').map(Number); return new Date(y || 1970, (m || 1) - 1, d || 1); };
const todayStr = () => new Date().toISOString().split('T')[0];
const money = n => '¥' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2 });
const shortMoney = n => '¥' + (n >= 10000 ? (n / 10000).toFixed(1) + '万' : Number(n||0).toLocaleString());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function showFront() {
  document.getElementById('front-app').hidden = false;
  document.getElementById('admin-app').hidden = true;
  renderFront();
  window.scrollTo(0, 0);
}

function showAdmin() {
  if (!isAdmin) return;
  document.getElementById('front-app').hidden = true;
  document.getElementById('admin-app').hidden = false;
  renderAdmin();
  window.scrollTo(0, 0);
}

document.getElementById('btn-show-front').onclick = showFront;
document.getElementById('btn-open-login').onclick = () => {
  if (localStorage.getItem('sb_token')) { isAdmin = true; showAdmin(); }
  else {
    document.getElementById('login-email').value = '';
    document.getElementById('login-pwd').value = '';
    document.getElementById('login-hint').textContent = '';
    document.getElementById('modal-login').classList.add('open');
  }
};

document.getElementById('btn-close-login').onclick = () => document.getElementById('modal-login').classList.remove('open');
document.getElementById('btn-cancel-login').onclick = () => document.getElementById('modal-login').classList.remove('open');
document.getElementById('btn-close-event').onclick = () => document.getElementById('modal-event').classList.remove('open');
document.getElementById('btn-cancel-event').onclick = () => document.getElementById('modal-event').classList.remove('open');
document.getElementById('btn-close-expense').onclick = () => document.getElementById('modal-expense').classList.remove('open');
document.getElementById('btn-cancel-expense').onclick = () => document.getElementById('modal-expense').classList.remove('open');

document.getElementById('lightbox').onclick = () => {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox').innerHTML = '';
};

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    currentAdminTab = tab.dataset.atab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
    document.querySelectorAll('.a-panel').forEach(p => p.classList.toggle('active', p.id === 'a-panel-' + currentAdminTab));
    const btnAdd = document.getElementById('btn-add');
    btnAdd.hidden = currentAdminTab === 'settings';
    btnAdd.textContent = currentAdminTab === 'timeline' ? '+ 新建活动' : '+ 记一笔账';
  };
});

document.getElementById('btn-add').onclick = () => {
  if (currentAdminTab === 'timeline') openEventModal(null);
  else if (currentAdminTab === 'expense') openExpenseModal(null);
};

document.getElementById('login-submit').onclick = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pwd = document.getElementById('login-pwd').value;
  if (!email || !pwd) return;
  const btn = document.getElementById('login-submit');
  btn.textContent = '登录中...';
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pwd })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || '邮箱或密码错误');
    localStorage.setItem('sb_token', data.access_token);
    isAdmin = true;
    document.getElementById('modal-login').classList.remove('open');
    showAdmin();
  } catch (err) {
    document.getElementById('login-hint').textContent = err.message;
  } finally {
    btn.textContent = '进入后台';
  }
};

document.getElementById('btn-logout').onclick = () => {
  localStorage.removeItem('sb_token');
  isAdmin = false;
  showFront();
};

document.getElementById('ev-files').onchange = function() {
  if (!this.files || this.files.length === 0) return;
  for(const f of this.files) {
    if(f.size > 50 * 1024 * 1024) { alert(`文件 "${f.name}" 超过50MB，请压缩`); continue; }
    window.pendingEvMedia.push({ file: f, type: f.type.startsWith('video') ? 'video' : 'image', name: f.name });
  }
  this.value = ''; 
  renderPreviews();
};

document.getElementById('ex-files').onchange = function() {
  if (!this.files || this.files.length === 0) return;
  for(const f of this.files) {
    if(!f.type.startsWith('image/')) continue;
    if(f.size > 50 * 1024 * 1024) { alert(`图片 "${f.name}" 超过50MB，请压缩`); continue; }
    window.pendingExMedia.push({ file: f, type: 'image', name: f.name });
  }
  this.value = '';
  renderPreviews();
};

window.removeEvMedia = function(i) {
  window.pendingEvMedia.splice(i, 1);
  renderPreviews();
};
window.removeExMedia = function(i) {
  window.pendingExMedia.splice(i, 1);
  renderPreviews();
};

function renderPreviews() {
  const evBox = document.getElementById('ev-preview'); 
  evBox.innerHTML = '';
  window.pendingEvMedia.forEach((m, i) => {
    const url = m.file ? window.URL.createObjectURL(m.file) : m.url;
    const pv = document.createElement('div');
    pv.className = 'pv-item';
    if (m.type === 'video') {
      const v = document.createElement('video');
      v.src = url; v.muted = true; v.playsInline = true;
      pv.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = url;
      pv.appendChild(img);
    }
    const btn = document.createElement('button');
    btn.className = 'pv-del'; btn.textContent = '✕'; btn.type = 'button';
    btn.onclick = () => removeEvMedia(i);
    pv.appendChild(btn);
    evBox.appendChild(pv);
  });

  const exBox = document.getElementById('ex-preview'); 
  exBox.innerHTML = '';
  window.pendingExMedia.forEach((m, i) => {
    const url = m.file ? window.URL.createObjectURL(m.file) : m.url;
    const pv = document.createElement('div');
    pv.className = 'pv-item';
    const img = document.createElement('img');
    img.src = url;
    pv.appendChild(img);
    const btn = document.createElement('button');
    btn.className = 'pv-del'; btn.textContent = '✕'; btn.type = 'button';
    btn.onclick = () => removeExMedia(i);
    pv.appendChild(btn);
    exBox.appendChild(pv);
  });
}

async function uploadFile(file) {
  const bucket = file.type.startsWith('video/') ? 'videos' : 'photos';
  const ext = file.name.split('.').pop() || 'bin';
  const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const token = localStorage.getItem('sb_token');
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Content-Type': file.type || 'application/octet-stream' },
    body: file
  });
  if (!res.ok) {
    if (res.status === 413) throw new Error('文件太大！免费版限制 50MB。');
    throw new Error(`上传失败(${res.status})`);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
}

function openEventModal(id) {
  editEvId = id;
  window.pendingEvMedia = [];
  const e = id ? events.find(x => x.id === id) : null;
  document.getElementById('ev-date').value = e ? e.date : todayStr();
  document.getElementById('ev-title').value = e ? e.title : '';
  document.getElementById('ev-desc').value = e ? e.desc : '';
  document.getElementById('ev-tags').value = e ? (e.tags || []).join(',') : '';
  if(e && e.media) window.pendingEvMedia = [...e.media];
  renderPreviews();
  document.getElementById('modal-event').classList.add('open');
}

function openExpenseModal(id) {
  editExId = id;
  window.pendingExMedia = [];
  const e = id ? expenses.find(x => x.id === id) : null;
  document.getElementById('ex-type').value = e ? (e.type || 'expense') : 'expense';
  document.getElementById('ex-date').value = e ? e.date : todayStr();
  document.getElementById('ex-amount').value = e ? e.amount : '';
  document.getElementById('ex-title').value = e ? e.title : '';
  document.getElementById('ex-cat').value = e ? e.category : '';
  document.getElementById('ex-note').value = e ? e.note : '';
  if(e && e.receipts) window.pendingExMedia = [...e.receipts];
  renderPreviews();
  document.getElementById('modal-expense').classList.add('open');
}

document.getElementById('ev-save').onclick = async function() {
  const title = document.getElementById('ev-title').value.trim();
  if (!title) return alert('请输入标题');
  const btn = this;
  btn.textContent = '保存中...';
  try {
    const mediaToSave = [];
    for(const m of window.pendingEvMedia) {
      if(m.file) {
        const url = await uploadFile(m.file);
        mediaToSave.push({ url, type: m.type, name: m.name });
      } else { mediaToSave.push(m); }
    }
    const rec = { date: document.getElementById('ev-date').value, type: document.getElementById('ev-type').value, title, desc: document.getElementById('ev-desc').value, tags: document.getElementById('ev-tags').value.split(',').map(s=>s.trim()).filter(Boolean), media: mediaToSave };
    if(editEvId) rec.id = editEvId;
    await api('/rest/v1/events', 'POST', rec);
    document.getElementById('modal-event').classList.remove('open');
    await loadData(); renderAdmin();
  } catch (err) { alert('保存失败: ' + err.message); } finally { btn.textContent = '保存'; }
};

document.getElementById('ex-save').onclick = async function() {
  const title = document.getElementById('ex-title').value.trim();
  const amount = Number(document.getElementById('ex-amount').value);
  if (!title) return alert('请输入项目名称');
  if (!(amount > 0)) return alert('金额必须大于0');
  
  const btn = this;
  btn.textContent = '保存中...';
  try {
    const receiptsToSave = [];
    for(const m of window.pendingExMedia) {
      if(m.file) {
        const url = await uploadFile(m.file);
        receiptsToSave.push({ url, type: m.type, name: m.name });
      } else { receiptsToSave.push(m); }
    }
    const rec = { 
      type: document.getElementById('ex-type').value,
      date: document.getElementById('ex-date').value, 
      amount, 
      title, 
      category: document.getElementById('ex-cat').value || '未分类', 
      note: document.getElementById('ex-note').value, 
      receipts: receiptsToSave 
    };
    if(editExId) rec.id = editExId;
    await api('/rest/v1/expenses', 'POST', rec);
    document.getElementById('modal-expense').classList.remove('open');
    await loadData(); renderAdmin();
  } catch (err) { alert('保存失败: ' + err.message); } finally { btn.textContent = '保存'; }
};

function buildEventCard(e, isAdmin) {
  const dt = parseDate(e.date);
  const mediaHTML = e.media && e.media.length ? `<div class="media-grid">${e.media.map(m => {
    const isVideo = m.type === 'video';
    const mediaTag = isVideo 
      ? `<video src="${m.url}" muted></video><div style="position:absolute;bottom:4px;right:4px;background:rgba(230,0,0,.8);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px">▶ 视频</div>` 
      : `<img src="${m.url}">`;
    return `<div class="media-item" onclick="showLightbox('${m.url}', '${m.type}')">${mediaTag}</div>`;
  }).join('')}</div>` : '';
  
  return `
    <article class="ev-card">
      <div class="ev-side"><div class="ev-day">${String(dt.getDate()).padStart(2, '0')}</div><div class="ev-mon">${String(dt.getMonth() + 1).padStart(2, '0')} 月</div></div>
      <div class="ev-main">
        <div class="ev-head">
          <h3>${esc(e.title)}</h3>
          ${isAdmin ? `<div style="margin-left:auto"><button class="icon-btn" onclick="openEventModal('${e.id}')">✏️</button><button class="icon-btn" onclick="delEvent('${e.id}')">🗑️</button></div>` : ''}
        </div>
        ${e.desc ? `<p class="ev-desc">${esc(e.desc)}</p>` : ''}
        ${mediaHTML}
      </div>
    </article>`;
}

function buildExpenseItem(e, isAdmin) {
  const dt = parseDate(e.date);
  const isIncome = e.type === 'income';
  const typePill = isIncome 
    ? `<span class="pill income">收入</span>` 
    : `<span class="pill expense">支出</span>`;
  const amountHTML = isIncome 
    ? `<div class="ex-amount" style="color:#34d399">+${money(e.amount)}</div>`
    : `<div class="ex-amount" style="color:#ff4d4d">-${money(e.amount)}</div>`;

  return `
    <div class="ex-item">
      <div class="ex-date">${String(dt.getMonth() + 1).padStart(2, '0')}/${String(dt.getDate()).padStart(2, '0')}</div>
      <div class="ex-main">
        <div class="ex-title">${esc(e.title)} ${typePill} <span style="font-size:11px;color:#777;font-weight:normal">${esc(e.category || '未分类')}</span></div>
        ${e.note ? `<div class="ex-note">${esc(e.note)}</div>` : ''}
      </div>
      ${amountHTML}
      ${isAdmin ? `<div><button class="icon-btn" onclick="openExpenseModal('${e.id}')">✏️</button><button class="icon-btn" onclick="delExpense('${e.id}')">🗑️</button></div>` : ''}
    </div>`;
}

window.delEvent = async function(id) {
  if(!confirm('确定删除这条记录吗？')) return;
  await api(`/rest/v1/events?id=eq.${id}`, 'DELETE');
  await loadData(); renderAdmin();
};

window.delExpense = async function(id) {
  if(!confirm('确定删除这笔账吗？')) return;
  await api(`/rest/v1/expenses?id=eq.${id}`, 'DELETE');
  await loadData(); renderAdmin();
};

window.showLightbox = function(url, type) {
  const lb = document.getElementById('lightbox');
  lb.innerHTML = type === 'video' 
    ? `<video src="${url}" controls autoplay playsinline></video>` 
    : `<img src="${url}">`;
  lb.classList.add('open');
};

function renderFront() {
  document.getElementById('f-year').textContent = new Date().getFullYear();
  
  const totalIncome = expenses.filter(e => e.type === 'income').reduce((s, e) => s + Number(e.amount || 0), 0);
  const totalExpense = expenses.filter(e => e.type !== 'income').reduce((s, e) => s + Number(e.amount || 0), 0);
  const balance = totalIncome - totalExpense;

  document.getElementById('f-hero-stats').innerHTML = `
    <div class="item"><b style="color:#fff">${events.length}</b><span>活动记录</span></div>
    <div class="item"><b style="color:#34d399">${shortMoney(totalIncome)}</b><span>总收入</span></div>
    <div class="item"><b style="color:#ff4d4d">${shortMoney(totalExpense)}</b><span>总支出</span></div>
    <div class="item"><b style="color:#60a5fa">${shortMoney(balance)}</b><span>结余</span></div>`;

  document.getElementById('f-timeline-list').innerHTML = events.length ? events.map(e => buildEventCard(e, false)).join('') : '<div class="empty"><div class="big">🕊️</div><p>暂无记录</p></div>';
  
  document.getElementById('f-expense-summary').innerHTML = `
    <div class="stat-card"><div class="label">总收入</div><div class="value" style="color:#34d399">${money(totalIncome)}</div></div>
    <div class="stat-card"><div class="label">总支出</div><div class="value" style="color:#ff4d4d">${money(totalExpense)}</div></div>
    <div class="stat-card"><div class="label">当前结余</div><div class="value" style="color:#60a5fa">${money(balance)}</div></div>`;

  document.getElementById('f-expense-list').innerHTML = expenses.length ? expenses.map(e => buildExpenseItem(e, false)).join('') : '<div class="empty"><div class="big">🧾</div><p>暂无账目</p></div>';
}

function renderAdmin() {
  const totalIncome = expenses.filter(e => e.type === 'income').reduce((s, e) => s + Number(e.amount || 0), 0);
  const totalExpense = expenses.filter(e => e.type !== 'income').reduce((s, e) => s + Number(e.amount || 0), 0);
  const balance = totalIncome - totalExpense;

  document.getElementById('a-expense-summary').innerHTML = `
    <div class="stat-card"><div class="label">总收入</div><div class="value" style="color:#34d399">${money(totalIncome)}</div></div>
    <div class="stat-card"><div class="label">总支出</div><div class="value" style="color:#ff4d4d">${money(totalExpense)}</div></div>
    <div class="stat-card"><div class="label">当前结余</div><div class="value" style="color:#60a5fa">${money(balance)}</div></div>`;

  document.getElementById('a-timeline-list').innerHTML = events.length ? events.map(e => buildEventCard(e, true)).join('') : '<div class="empty">暂无记录</div>';
  document.getElementById('a-expense-list').innerHTML = expenses.length ? expenses.map(e => buildExpenseItem(e, true)).join('') : '<div class="empty">暂无账目</div>';
}

async function loadData() {
  try {
    const [ev, ex] = await Promise.all([ 
      api('/rest/v1/events?select=*&order=date.desc').catch(e => { throw new Error('活动表读取失败: ' + e.message); }), 
      api('/rest/v1/expenses?select=*&order=date.desc').catch(e => { throw new Error('账本读取失败: ' + e.message); }) 
    ]);
    events = ev || []; expenses = ex || [];
  } catch (e) { 
    console.error(e); 
    throw e;
  }
}

(async function init() {
  try {
    await loadData();
    if (localStorage.getItem('sb_token')) isAdmin = true;
  } catch (err) {
    console.warn(err.message);
    alert('数据加载失败：' + err.message + '\n可能是因为当前设备的网络无法直连数据库，请尝试切换网络或使用加速器。');
  }
  showFront();
})();
</script>
