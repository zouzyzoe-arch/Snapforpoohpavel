<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>站子工作台</title>
<script>
  // 故障报警器
  window.addEventListener('error', function(e) {
    if(e.message && e.message.includes('supabase')) {
      alert('加载 Supabase 库失败！请检查你的网络，或者尝试切换一下手机网络再刷新。');
    }
  }, true);
</script>
<!-- 引入 Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;height:100%}
body{
  margin:0;min-height:100%;color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0a0b10;color:#e9eaf2;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 520px at 8% -10%, rgba(255,92,138,.14), transparent 62%),
    radial-gradient(820px 520px at 92% -4%, rgba(168,85,247,.13), transparent 62%);
  background-attachment:fixed;
}
.btn{border:none;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.16s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:linear-gradient(135deg,#ff5c8a,#a855f7);color:#fff}
.btn.ghost{background:#1a1d27;color:#c0c4d4;border:1px solid #272b38}
.btn.danger{background:rgba(255,92,138,.14);color:#ff7ba3;border:1px solid rgba(255,92,138,.35)}
.icon-btn{background:transparent;border:none;color:#8b90a6;font-size:16px;cursor:pointer;width:30px;height:30px;border-radius:8px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,#ff5c8a,#a855f7)}
.brand-name{font-size:15px;font-weight:700}
.brand-sub{margin-top:1px;font-size:11.5px;color:#7d8299}
.front-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;padding:13px 28px;background:rgba(10,11,16,.82);backdrop-filter:blur(14px);border-bottom:1px solid #1c1f29;flex-wrap:wrap}
.front-nav{display:flex;gap:6px;margin-left:auto}
.front-nav a{color:#9aa0b5;text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:9px}
.front-main{max-width:980px;margin:0 auto;padding:30px 24px 70px}
.hero{position:relative;text-align:center;padding:62px 24px 50px;border-radius:26px;border:1px solid #1f232e;margin-bottom:44px;background:linear-gradient(180deg,#12141c,#0d0f16)}
.hero h1{font-size:clamp(27px,5vw,44px);margin:16px 0 12px;background:linear-gradient(120deg,#ffffff 25%,#ffb3c9 55%,#c9a3ff 90%);-webkit-background-clip:text;color:transparent}
.hero-stats{display:flex;justify-content:center;gap:46px;margin-top:36px;flex-wrap:wrap}
.hero-stats b{display:block;font-size:25px;font-weight:800;background:linear-gradient(135deg,#ff5c8a,#a855f7);-webkit-background-clip:text;color:transparent}
.hero-stats span{display:block;margin-top:5px;font-size:12px;color:#7d8299}
.front-section{margin-bottom:56px}
.section-head h2{font-size:19px;margin:0;letter-spacing:.5px}
.section-sub{font-size:12.5px;color:#7d8299}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:#141620;border:1px solid #232734;border-radius:11px;padding:11px 14px;color:#e9eaf2;font-size:13.5px;outline:none}
.select{background:#141620;border:1px solid #232734;border-radius:11px;padding:11px 13px;color:#e9eaf2;font-size:13.5px}
.ev-card{display:flex;gap:16px;background:#13151d;border:1px solid #1f232e;border-radius:16px;padding:16px;margin-bottom:12px}
.ev-side{flex:0 0 62px;text-align:center;border-right:1px solid #1f232e;padding-right:14px}
.ev-day{font-size:24px;font-weight:800;background:linear-gradient(135deg,#ff5c8a,#a855f7);-webkit-background-clip:text;color:transparent}
.ev-main{flex:1}
.ev-head h3{font-size:15px;margin:0;font-weight:700}
.ev-desc{font-size:13.5px;color:#a2a7ba;line-height:1.75;margin:8px 0 0}
.ev-tags span{font-size:11.5px;color:#8b90a6;background:#1a1d27;padding:3px 9px;border-radius:8px;margin-right:5px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-top:12px}
.media-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#0e1017;cursor:zoom-in}
.media-item img,.media-item video{width:100%;height:100%;object-fit:cover}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:#161924;border:1px solid #222633;border-radius:15px;padding:15px 18px}
.stat-card .label{font-size:12.5px;color:#8b90a6}
.stat-card .value{font-size:23px;font-weight:800;margin-top:6px}
.cat-chart{background:#13151d;border:1px solid #1f232e;border-radius:15px;padding:16px 18px;margin-bottom:18px}
.ex-item{display:flex;align-items:center;gap:14px;background:#13151d;border:1px solid #1f232e;border-radius:13px;padding:13px 16px;margin-bottom:9px}
.ex-date{font-size:11.5px;color:#7d8299;background:#1a1d27;padding:5px 9px;border-radius:8px}
.ex-main{flex:1}
.ex-title{font-size:14px;font-weight:600}
.ex-note{font-size:12.5px;color:#7d8299;margin-top:3px}
.ex-amount{font-size:15.5px;font-weight:700;color:#ff7ba3}
.admin-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:12px 24px;background:rgba(10,11,16,.86);border-bottom:1px solid #1c1f29}
.tabs{display:flex;gap:4px;background:#141620;padding:4px;border-radius:12px}
.tab{background:transparent;border:none;color:#8b90a6;padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600}
.tab.active{background:rgba(255,92,138,.2);color:#fff}
.admin-main{max-width:1080px;margin:0 auto;padding:26px 24px 90px}
.a-panel{display:none}
.a-panel.active{display:block}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.76);display:none;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal.open{display:flex}
.modal-box{background:#12141c;border:1px solid #252938;border-radius:18px;width:100%;max-width:620px;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid #1f232e}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid #1f232e}
.field{display:flex;flex-direction:column;gap:7px;flex:1}
.field>span{font-size:12.5px;color:#8b90a6;font-weight:600}
.field input,.field select,.field textarea{background:#0e1017;border:1px solid #242836;border-radius:10px;padding:11px 13px;color:#e9eaf2;font-size:13.5px;outline:none;width:100%}
.row{display:flex;gap:14px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(168,85,247,.16);color:#c9a3ff}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:300;display:none;align-items:center;justify-content:center;padding:28px}
.lightbox.open{display:flex}
.lightbox img,.lightbox video{max-width:100%;max-height:100%}
.empty{text-align:center;padding:58px 20px;color:#5a5f74}
.media-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.pv-item{aspect-ratio:1;border-radius:9px;overflow:hidden;background:#0e1017;position:relative}
.pv-item img,.pv-item video{width:100%;height:100%;object-fit:cover}
.pv-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.75);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer}
.dropzone{border:1.5px dashed #2c3140;border-radius:12px;padding:20px;text-align:center;color:#6b7089;font-size:13px;cursor:pointer}
</style>
</head>
<body>

<div id="front-app">
  <header class="front-header">
    <div class="brand">
      <div class="logo">★</div>
      <div>
        <div class="brand-name" id="f-site-name">星光记录站</div>
        <div class="brand-sub" id="f-site-desc">记录每一次心动瞬间</div>
      </div>
    </div>
    <nav class="front-nav">
      <a href="#f-timeline">活动时间线</a>
      <a href="#f-expense">应援账本</a>
    </nav>
    <button class="btn ghost" id="btn-to-admin">🔒 管理入口</button>
  </header>

  <main class="front-main">
    <section class="hero">
      <h1 id="f-hero-name">星光记录站</h1>
      <p id="f-hero-desc">记录每一次心动瞬间</p>
      <div class="hero-stats" id="f-hero-stats"></div>
    </section>

    <section id="f-timeline" class="front-section">
      <div class="section-head">
        <h2>活动时间线</h2>
      </div>
      <div class="toolbar">
        <input class="search" id="f-search-events" placeholder="搜索活动标题 / 内容 / 标签…">
      </div>
      <div id="f-timeline-list"></div>
    </section>

    <section id="f-expense" class="front-section">
      <div class="section-head">
        <h2>应援账本公示</h2>
      </div>
      <div class="summary" id="f-expense-summary"></div>
      <div class="cat-chart" id="f-cat-chart"></div>
      <div id="f-expense-list"></div>
    </section>
  </main>
</div>

<div id="admin-app" hidden>
  <header class="admin-header">
    <div class="brand">
      <div class="logo">⚙</div>
      <div>
        <div class="brand-name">站子后台</div>
        <div class="brand-sub" id="a-site-name">星光记录站</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-atab="timeline">🕒 活动管理</button>
      <button class="tab" data-atab="expense">💰 支出管理</button>
      <button class="tab" data-atab="settings">⚙ 设置</button>
    </nav>
    <div class="top-actions">
      <button class="btn ghost" id="btn-to-front">查看前台</button>
      <button class="btn primary" id="btn-add">+ 新建活动</button>
    </div>
  </header>

  <main class="admin-main">
    <section id="a-panel-timeline" class="a-panel active">
      <div class="toolbar">
        <input class="search" id="a-search-events" placeholder="搜索活动标题 / 内容 / 标签…">
      </div>
      <div id="a-timeline-list"></div>
    </section>

    <section id="a-panel-expense" class="a-panel">
      <div class="summary" id="a-expense-summary"></div>
      <div class="toolbar">
        <input class="search" id="a-search-expenses" placeholder="搜索支出项目 / 备注…">
        <select class="select" id="a-filter-cat"><option value="all">全部分类</option></select>
      </div>
      <div class="cat-chart" id="a-cat-chart"></div>
      <div id="a-expense-list"></div>
    </section>

    <section id="a-panel-settings" class="a-panel">
      <div class="settings-grid">
        <div class="settings-card">
          <h3>站点信息</h3>
          <label class="field"><span>站子名称</span><input type="text" id="set-name"></label>
          <label class="field"><span>站子简介</span><input type="text" id="set-desc"></label>
          <button class="btn primary" id="set-save-site">保存站点信息</button>
        </div>
        <div class="settings-card danger">
          <h3>退出登录</h3>
          <button class="btn danger" id="btn-logout">退出登录</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal-login">
  <div class="modal-box" style="max-width:390px">
    <div class="modal-head">
      <h2>管理登录</h2>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="modal-body">
      <label class="field"><span>管理员邮箱</span><input type="email" id="login-email" placeholder="输入邮箱"></label>
      <label class="field"><span>密码</span><input type="password" id="login-pwd" placeholder="输入密码"></label>
      <p id="login-hint" style="color:#ff7ba3;font-size:12px;margin:0"></p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn primary" id="login-submit">进入后台</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-event">
  <div class="modal-box">
    <div class="modal-head"><h2>活动记录</h2><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="row">
        <label class="field"><span>日期</span><input type="date" id="ev-date"></label>
        <label class="field"><span>活动类型</span>
          <select id="ev-type"><option>演唱会</option><option>见面会</option><option>打歌 / 舞台</option><option>其他</option></select>
        </label>
      </div>
      <label class="field"><span>标题</span><input type="text" id="ev-title" placeholder="例：首尔演唱会 Day1"></label>
      <label class="field"><span>记录内容</span><textarea id="ev-desc" rows="3"></textarea></label>
      <label class="field"><span>标签</span><input type="text" id="ev-tags" placeholder="舞台, 饭拍"></label>
      <div class="field">
        <span>图片 / 视频</span>
        <div class="dropzone" id="ev-drop"><input type="file" id="ev-files" accept="image/*,video/*" multiple hidden><div>点击上传</div></div>
        <div class="media-preview" id="ev-preview"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" data-close>取消</button><button class="btn primary" id="ev-save">保存</button></div>
  </div>
</div>

<div class="modal" id="modal-expense">
  <div class="modal-box" style="max-width:540px">
    <div class="modal-head"><h2>支出记录</h2><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="row">
        <label class="field"><span>日期</span><input type="date" id="ex-date"></label>
        <label class="field"><span>金额（元）</span><input type="number" id="ex-amount" min="0" step="0.01"></label>
      </div>
      <label class="field"><span>支出项目</span><input type="text" id="ex-title"></label>
      <label class="field"><span>分类</span><input type="text" id="ex-cat" list="cat-options">
        <datalist id="cat-options"><option value="应援物"></option><option value="广告投放"></option><option value="集资"></option><option value="其他"></option></datalist>
      </label>
      <label class="field"><span>备注</span><textarea id="ex-note" rows="2"></textarea></label>
      <div class="field">
        <span>凭证截图（可选）</span>
        <div class="dropzone" id="ex-drop"><input type="file" id="ex-files" accept="image/*" multiple hidden><div>点击上传</div></div>
        <div class="media-preview" id="ex-preview"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" data-close>取消</button><button class="btn primary" id="ex-save">保存</button></div>
  </div>
</div>

<div class="lightbox" id="lightbox"></div>

<script>
// ==========================================
// 已自动填好你的密钥
// ==========================================
const SUPABASE_URL = 'https://jhdmotgxxetvdjslgiek.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9XIghyqF1T6N0SwR75Ml7w_UKnRXEPm';
// ==========================================

if(!window.supabase) {
  alert('加载失败：请检查你的网络，或者更新浏览器。');
}

let supabaseClient;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  alert('初始化失败！请检查密钥是否填对。\n错误信息: ' + e.message);
}

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '¥' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2 });
const shortMoney = n => '¥' + (n >= 10000 ? (n / 10000).toFixed(1) + '万' : Number(n||0).toLocaleString());
const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const todayStr = () => new Date().toISOString().split('T')[0];
const parseDate = s => { const [y, m, d] = String(s || '').split('-').map(Number); return new Date(y || 1970, (m || 1) - 1, d || 1); };

let settings = JSON.parse(localStorage.getItem('fanstation:settings') || '{"siteName":"星光记录站","siteDesc":"记录每一次心动瞬间"}');
let events = [], expenses = [];
let isAdmin = false, currentAdminTab = 'timeline';

function showLightbox(url, type) {
  const lb = $('#lightbox'); lb.innerHTML = '';
  const m = document.createElement(type === 'video' ? 'video' : 'img');
  m.src = url; if(type === 'video') { m.controls = true; m.autoplay = true; }
  lb.appendChild(m); lb.classList.add('open');
}
$('#lightbox').addEventListener('click', () => { $('#lightbox').classList.remove('open'); $('#lightbox').innerHTML = ''; });

function buildEventCard(e, admin) {
  const dt = parseDate(e.date);
  const card = el('article', 'ev-card');
  card.innerHTML = `
    <div class="ev-side">
      <div class="ev-day">${String(dt.getDate()).padStart(2, '0')}</div>
      <div class="ev-mon">${String(dt.getMonth() + 1).padStart(2, '0')} 月</div>
      <div class="ev-week">${WEEK[dt.getDay()]}</div>
    </div>
    <div class="ev-main">
      <div class="ev-head">
        <h3>${esc(e.title) || '（无标题）'}</h3>
        ${e.type ? `<span class="pill">${esc(e.type)}</span>` : ''}
        ${admin ? `<div style="margin-left:auto"><button class="icon-btn" onclick="openEventModal('${e.id}')">✏️</button><button class="icon-btn" onclick="delEvent('${e.id}')">🗑️</button></div>` : ''}
      </div>
      ${e.desc ? `<p class="ev-desc">${esc(e.desc)}</p>` : ''}
      ${e.tags && e.tags.length ? `<div class="ev-tags">${e.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}
      ${e.media && e.media.length ? `<div class="media-grid">${e.media.map(m => `<div class="media-item" onclick="showLightbox('${m.url}', '${m.type}')"><img src="${m.url}" loading="lazy"></div>`).join('')}</div>` : ''}
    </div>`;
  return card;
}

function buildExpenseItem(e, admin) {
  const dt = parseDate(e.date);
  const item = el('div', 'ex-item');
  item.innerHTML = `
    <div class="ex-date">${String(dt.getMonth() + 1).padStart(2, '0')}/${String(dt.getDate()).padStart(2, '0')}</div>
    <div class="ex-main">
      <div class="ex-title">${esc(e.title)} <span class="pill">${esc(e.category || '未分类')}</span></div>
      ${e.note ? `<div class="ex-note">${esc(e.note)}</div>` : ''}
    </div>
    <div class="ex-amount">${money(e.amount)}</div>
    ${admin ? `<div><button class="icon-btn" onclick="openExpenseModal('${e.id}')">✏️</button><button class="icon-btn" onclick="delExpense('${e.id}')">🗑️</button></div>` : ''}`;
  return item;
}

function renderFront() {
  $('#f-site-name').textContent = settings.siteName;
  $('#f-site-desc').textContent = settings.siteDesc;
  $('#f-hero-name').textContent = settings.siteName;
  $('#f-hero-desc').textContent = settings.siteDesc;

  const st = { total: expenses.reduce((s, e) => s + Number(e.amount||0), 0), count: expenses.length };
  $('#f-hero-stats').innerHTML = `<div class="item"><b>${events.length}</b><span>活动记录</span></div><div class="item"><b>${st.count}</b><span>支出笔数</span></div><div class="item"><b>${shortMoney(st.total)}</b><span>应援总额</span></div>`;

  const list = $('#f-timeline-list'); list.innerHTML = '';
  if(!events.length) list.innerHTML = '<div class="empty"><div class="big">🕊️</div><p>暂无记录</p></div>';
  else events.forEach(e => list.appendChild(buildEventCard(e, false)));

  const exList = $('#f-expense-list'); exList.innerHTML = '';
  $('#f-expense-summary').innerHTML = `<div class="stat-card"><div class="label">总支出</div><div class="value">${money(st.total)}</div></div>`;
  if(!expenses.length) exList.innerHTML = '<div class="empty"><div class="big">🧾</div><p>暂无支出</p></div>';
  else expenses.forEach(e => exList.appendChild(buildExpenseItem(e, false)));
}

function renderAdmin() {
  $('#a-site-name').textContent = settings.siteName;
  const list = $('#a-timeline-list'); list.innerHTML = '';
  if(!events.length) list.innerHTML = '<div class="empty">暂无记录</div>';
  else events.forEach(e => list.appendChild(buildEventCard(e, true)));

  const exList = $('#a-expense-list'); exList.innerHTML = '';
  if(!expenses.length) exList.innerHTML = '<div class="empty">暂无支出</div>';
  else expenses.forEach(e => exList.appendChild(buildExpenseItem(e, true)));
}

function showFront() { $('#front-app').hidden = false; $('#admin-app').hidden = true; renderFront(); }
function showAdmin() { if (!isAdmin) return; $('#front-app').hidden = true; $('#admin-app').hidden = false; renderAdmin(); }

// 登录
$('#btn-to-admin').addEventListener('click', async () => {
  if(!supabaseClient) { alert("库未加载，请刷新页面"); return; }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) { isAdmin = true; showAdmin(); }
  else { $('#modal-login').classList.add('open'); }
});

$('#login-submit').addEventListener('click', async () => {
  const email = $('#login-email').value.trim();
  const pwd = $('#login-pwd').value;
  if (!email || !pwd) return;
  $('#login-submit').textContent = '登录中...';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pwd });
  $('#login-submit').textContent = '进入后台';
  if (error) { $('#login-hint').textContent = error.message; return; }
  isAdmin = true; $('#modal-login').classList.remove('open'); showAdmin();
});

$('#btn-to-front').addEventListener('click', showFront);
$('#btn-logout').addEventListener('click', async () => { await supabaseClient.auth.signOut(); isAdmin = false; showFront(); });

// 弹窗控制
$$('[data-close]').forEach(btn => btn.addEventListener('click', (e) => e.target.closest('.modal').classList.remove('open')));

// 数据库操作
async function loadData() {
  const [ev, ex] = await Promise.all([
    supabaseClient.from('events').select('*').order('date', { ascending: false }),
    supabaseClient.from('expenses').select('*').order('date', { ascending: false })
  ]);
  events = ev.data || []; expenses = ex.data || [];
}

// 新建/保存活动
window.openEventModal = function(id) {
  const e = id ? events.find(x => x.id === id) : null;
  $('#ev-date').value = e ? e.date : todayStr();
  $('#ev-title').value = e ? e.title : '';
  $('#ev-desc').value = e ? e.desc : '';
  $('#ev-tags').value = e ? (e.tags||[]).join(',') : '';
  $('#modal-event').dataset.id = id || '';
  $('#modal-event').classList.add('open');
};

window.delEvent = async function(id) {
  if(!confirm('确定删除？')) return;
  await supabaseClient.from('events').delete().eq('id', id);
  await loadData(); renderAdmin();
};

$('#ev-save').addEventListener('click', async () => {
  const title = $('#ev-title').value.trim(); if (!title) return alert('请输入标题');
  const id = $('#modal-event').dataset.id;
  $('#ev-save').textContent = '保存中...';
  const rec = { date: $('#ev-date').value, type: $('#ev-type').value, title, desc: $('#ev-desc').value, tags: $('#ev-tags').value.split(',') };
  if (id) rec.id = id;
  const { error } = await supabaseClient.from('events').upsert(rec);
  $('#ev-save').textContent = '保存';
  if (error) return alert(error.message);
  $('#modal-event').classList.remove('open'); await loadData(); renderAdmin();
});

window.openExpenseModal = function(id) {
  const e = id ? expenses.find(x => x.id === id) : null;
  $('#ex-date').value = e ? e.date : todayStr();
  $('#ex-amount').value = e ? e.amount : '';
  $('#ex-title').value = e ? e.title : '';
  $('#ex-cat').value = e ? e.category : '';
  $('#ex-note').value = e ? e.note : '';
  $('#modal-expense').dataset.id = id || '';
  $('#modal-expense').classList.add('open');
};

window.delExpense = async function(id) {
  if(!confirm('确定删除？')) return;
  await supabaseClient.from('expenses').delete().eq('id', id);
  await loadData(); renderAdmin();
};

$('#ex-save').addEventListener('click', async () => {
  const title = $('#ex-title').value.trim(); if (!title) return alert('请输入项目');
  const amount = Number($('#ex-amount').value); if (!(amount>0)) return alert('金额不正确');
  const id = $('#modal-expense').dataset.id;
  $('#ex-save').textContent = '保存中...';
  const rec = { date: $('#ex-date').value, amount, title, category: $('#ex-cat').value, note: $('#ex-note').value };
  if (id) rec.id = id;
  const { error } = await supabaseClient.from('expenses').upsert(rec);
  $('#ex-save').textContent = '保存';
  if (error) return alert(error.message);
  $('#modal-expense').classList.remove('open'); await loadData(); renderAdmin();
});

// 启动
(async function init() {
  if(supabaseClient) {
    await loadData();
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) isAdmin = true;
  }
  showFront();
})();
</script>
</body>
</html>
